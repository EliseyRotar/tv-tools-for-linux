{% extends "base.html" %}

{% block title %}App Management - TV Tools for Linux{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <h1 class="mb-4"><i class="bi bi-box-seam"></i> App Management</h1>

    <!-- Filter Tabs -->
    <ul class="nav nav-tabs mb-4" id="appTabs">
        <li class="nav-item">
            <button class="nav-link active" onclick="setFilter('all', this)">All Apps</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" onclick="setFilter('user', this)">User Apps</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" onclick="setFilter('system', this)">System Apps</button>
        </li>
    </ul>

    <!-- Actions Row -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="searchInput" placeholder="Search apps...">
            </div>
        </div>
        <div class="col-md-6 text-end">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#installModal">
                <i class="bi bi-upload"></i> Install APK
            </button>
            <button class="btn btn-secondary" onclick="refreshApps()">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
        </div>
    </div>

    <!-- Apps Table -->
    <div class="card">
        <div class="card-body">
            <div id="loadingApps" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Loading apps...</p>
            </div>

            <div id="appsTable" style="display: none;">
                <div class="table-responsive">
                    <table class="table table-hover table-sm align-middle">
                        <thead>
                            <tr>
                                <th style="width:40px">Type</th>
                                <th style="width:40px">Status</th>
                                <th>Name / Package</th>
                                <th style="width:80px">Version</th>
                                <th style="width:100px">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="appsTableBody">
                        </tbody>
                    </table>
                </div>
                <div id="appsCount" class="text-muted mt-2 small"></div>
            </div>

            <div id="noApps" style="display: none;" class="text-center py-5">
                <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                <p class="mt-2">No apps found</p>
            </div>
        </div>
    </div>
</div>

<!-- Install APK Modal -->
<div class="modal fade" id="installModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-upload"></i> Install APK</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="installForm">
                    <div class="mb-3">
                        <label for="apkFile" class="form-label">Select APK File</label>
                        <input type="file" class="form-control" id="apkFile" accept=".apk" required>
                    </div>
                    <div id="installProgress" style="display: none;">
                        <div class="progress">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%"></div>
                        </div>
                        <p class="text-center mt-2">Installing...</p>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="installAPK()">Install</button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/apps.js') }}"></script>
{% endblock %}
